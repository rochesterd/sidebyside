<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" color="#FBF8F3" role="img" aria-label="NECO Reflex recording" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NECO Reflex — recording</title>
  <!-- Ring color follows `color` on the root element. Off-White (#FBF8F3) on
       charcoal surfaces, Charcoal (#231E21) on off-white surfaces.
       The pupil stays Crimson on every surface — it is the red reflex. -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="10"/>
  <circle cx="50" cy="50" r="22" fill="#A42B35"/>
</svg>
